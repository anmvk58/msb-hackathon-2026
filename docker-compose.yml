services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: corebanking
      MYSQL_USER: corebanking
      MYSQL_PASSWORD: corebanking
      MYSQL_ROOT_PASSWORD: corebanking-root
    ports:
      - "3306:3306"
    volumes:
      - corebanking-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  corebanking:
    build:
      context: ./mock-core-banking-service
      dockerfile: Dockerfile
    environment:
      TZ: Asia/Ho_Chi_Minh
      CORE_BANKING_DATABASE_URL: mysql+pymysql://corebanking:corebanking@mysql:3306/corebanking?charset=utf8mb4
      CORE_BANKING_SEED_DEMO_ON_START: "true"
      CORE_BANKING_CORS_ORIGINS: http://localhost:3000,http://localhost:5173
    depends_on:
      mysql:
        condition: service_healthy
    restart: on-failure
    ports:
      - "8090:8090"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  financial-radar-agent:
    build:
      context: ./financial-radar-service
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      TZ: Asia/Ho_Chi_Minh
      APP_ENV: development
      AGENT_RUNTIME: ${AGENT_RUNTIME:-local}
      DATABASE_URL: sqlite:////data/financial-radar-agent.db
      CORE_BANKING_BASE_URL: http://corebanking:8090
      CORE_BANKING_TIMEOUT_SECONDS: "10"
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
    depends_on:
      corebanking:
        condition: service_healthy
    restart: on-failure
    ports:
      - "8080:8080"
    volumes:
      - financial-radar-agent-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  frontend-mobile:
    build:
      context: ./frontend-mobile
      dockerfile: Dockerfile
    depends_on:
      financial-radar-agent:
        condition: service_healthy
      corebanking:
        condition: service_healthy
    ports:
      - "3000:80"
    restart: on-failure

volumes:
  corebanking-mysql-data:
  financial-radar-agent-data:
