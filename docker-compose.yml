services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: corebanking
      MYSQL_USER: corebanking
      MYSQL_PASSWORD: corebanking
      MYSQL_ROOT_PASSWORD: corebanking-root
    ports:
      - "3306:3306"
    volumes:
      - corebanking-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  corebanking:
    build:
      context: ./mock-core-banking-service
      dockerfile: Dockerfile
    environment:
      TZ: Asia/Ho_Chi_Minh
      CORE_BANKING_DATABASE_URL: mysql+pymysql://corebanking:corebanking@mysql:3306/corebanking?charset=utf8mb4
      CORE_BANKING_SEED_DEMO_ON_START: "true"
      CORE_BANKING_CORS_ORIGINS: http://localhost:3000,http://localhost:5173
    depends_on:
      mysql:
        condition: service_healthy
    restart: on-failure
    ports:
      - "8090:8090"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  financial-radar-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${FINANCIAL_RADAR_DB_NAME:-financial_radar}
      POSTGRES_USER: ${FINANCIAL_RADAR_DB_USER:-financial_radar}
      POSTGRES_PASSWORD: ${FINANCIAL_RADAR_DB_PASSWORD:-financial_radar}
    ports:
      - "5433:5432"
    volumes:
      - financial-radar-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  financial-radar-agent:
    build:
      context: ./financial-radar-service
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      TZ: Asia/Ho_Chi_Minh
      APP_ENV: development
      AGENT_RUNTIME: ${AGENT_RUNTIME:-local}
      DATABASE_URL: postgresql+psycopg://${FINANCIAL_RADAR_DB_USER:-financial_radar}:${FINANCIAL_RADAR_DB_PASSWORD:-financial_radar}@financial-radar-db:5432/${FINANCIAL_RADAR_DB_NAME:-financial_radar}
      CORE_BANKING_BASE_URL: http://corebanking:8090
      CORE_BANKING_TIMEOUT_SECONDS: "10"
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-90}
    depends_on:
      corebanking:
        condition: service_healthy
      financial-radar-db:
        condition: service_healthy
    restart: on-failure
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  financial-radar-scheduler:
    build:
      context: ./financial-radar-service
      dockerfile: Dockerfile
    command: ["python", "scheduler.py"]
    env_file:
      - .env
    environment:
      TZ: Asia/Ho_Chi_Minh
      APP_ENV: development
      AGENT_RUNTIME: ${AGENT_RUNTIME:-local}
      DATABASE_URL: postgresql+psycopg://${FINANCIAL_RADAR_DB_USER:-financial_radar}:${FINANCIAL_RADAR_DB_PASSWORD:-financial_radar}@financial-radar-db:5432/${FINANCIAL_RADAR_DB_NAME:-financial_radar}
      CORE_BANKING_BASE_URL: http://corebanking:8090
      CORE_BANKING_TIMEOUT_SECONDS: "10"
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-90}
      SCHEDULER_INTERVAL_SECONDS: ${SCHEDULER_INTERVAL_SECONDS:-180}
      SCHEDULER_CUSTOMER_IDS: ${SCHEDULER_CUSTOMER_IDS:-C001,C002,C003,C004}
    depends_on:
      financial-radar-agent:
        condition: service_healthy
      financial-radar-db:
        condition: service_healthy
      corebanking:
        condition: service_healthy
    restart: unless-stopped

  frontend-mobile:
    build:
      context: ./frontend-mobile
      dockerfile: Dockerfile
    depends_on:
      financial-radar-agent:
        condition: service_healthy
      corebanking:
        condition: service_healthy
    ports:
      - "3000:80"
    restart: on-failure

volumes:
  corebanking-mysql-data:
  financial-radar-postgres-data:
