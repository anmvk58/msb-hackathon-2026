[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "msb-core-banking-admin"
version = "0.1.0"
description = "Demo administration facade for MSB Mock Core Banking"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<0.117",
  "uvicorn[standard]>=0.30,<1",
  "httpx>=0.27,<1",
  "pydantic-settings>=2.2,<3",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
