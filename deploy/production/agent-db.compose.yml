services:
  financial-radar-db:
    image: postgres:17-alpine
    env_file: ./agent-db.env
    ports:
      - "${AGENT_DB_BIND_IP:?Set AGENT_DB_BIND_IP to the private server IP}:5432:5432"
    volumes:
      - financial-radar-postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

volumes:
  financial-radar-postgres-data:
